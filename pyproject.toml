[project]
name = "scenario-builder-mazsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jkolberg", email = "jkolberg@psrc.org" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "iteround>=1.0.4",
    "psrcelmerpy @git+https://github.com/psrc/psrcelmerpy.git",
    "soundcast_landuse_scenario_builder",
]

[tool.uv.sources]
soundcast_landuse_scenario_builder = { path = "../soundcast_landuse_scenario_builder", editable = true }

[project.scripts]
scenario-builder-mazsim = "scenario_builder_mazsim:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
